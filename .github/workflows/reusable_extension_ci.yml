on:
  workflow_call:

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        pg-version: ["14", "15", "16", "17", "18", "19"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1

      - name: Use Cachix Cache
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: nxpg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix develop --command xpg --cassert -v ${{ matrix.pg-version }} build

      - name: Run tests
        run: nix develop --command xpg --cassert -v ${{ matrix.pg-version }} test


  test-on-macos:
    runs-on: blacksmith-6vcpu-macos-26
    strategy:
      matrix:
        pg-version: ["17"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable # needed to solve a bash error on CI

      - name: Use Cachix Cache
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: nxpg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: clang analyze
        run: |
          CPPFLAGS='--analyze -Xanalyzer  -analyzer-werror' nix develop --command xpg -v ${{ matrix.pg-version }} build
          rm -rf ./build-${{ matrix.pg-version }}

      - name: Build
        run: nix develop --command xpg -v ${{ matrix.pg-version }} build

      - name: Run tests
        run: nix develop --command xpg -v ${{ matrix.pg-version }} test

  coverage:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    strategy:
      matrix:
        pg-version: ["17"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1

      - name: Use Cachix Cache
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: nxpg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Coverage
        run: nix develop --command xpg -v ${{ matrix.pg-version }} coverage

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: ./build-${{ matrix.pg-version }}/coverage.info
